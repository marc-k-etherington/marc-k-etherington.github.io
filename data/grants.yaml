# =============================================================================
# GRANTS AND FUNDING: newest at the top. Current or past is worked out from the
# end year. Tag with themes; link projects to a grant with `funding: <id>` in
# data/projects.yaml.
#
# WHO HOLDS IT: leave `holder` out for your own grants (then `role` says PI or
# Co-I). For funding held by a group member (travel grants, fellowships,
# student awards), add `holder: Surname`: it is listed separately as funding
# won by group members, shown on their Group card, and kept out of your total.
#
# - id: short-name                 # used to link projects to this grant
#   title: "Grant title"
#   short: "Short name"            # optional: used on cards where space is tight
#   funder: "Funder name"
#   start: 2026
#   end: 2028
#   role: PI                       # your grants: PI or Co-I
#   amount_gbp: 50000              # optional; leave out to keep it private
#   holder: Surname                # only for funding held by a group member
#   collaborators: [takeda]        # optional: ids from data/collaborators.yaml
#   themes: [tadf]
#   description: "One sentence."
#
# Funding total: while data/metrics.yaml has a `funding:` figure, that is shown.
# Once every grant has amount_gbp, delete that line and the total is calculated.
# =============================================================================

