# =============================================================================
# PUBLICATIONS: newest at the top. Everything on the site updates from this list:
# the Publications page, its filters and counts, the publication count on the
# Marc and Research pages, and Research "Featured Publications".
#
# To add a paper, copy this block to the top of the list and fill it in:
#
# - title: "Paper title"
#   year: 2026
#   authors: "First Author, Marc K. Etherington* & Last Author*"
#   journal: "Journal Name, volume, pages"
#   url: https://doi.org/...
#   doi: 10.xxxx/xxxxx
#   image: /post/images/My_TOC.jpg      # optional: put the TOC graphic in content/post/images
#   themes: [tadf, ct]                   # research themes (ids in data/themes.yaml)
#   review: true                         # optional: only for review articles
#   featured: "One-line description"     # optional: shows it on the Research page
#
# Automatic: an asterisk after your name (Etherington*) marks you as corresponding
# author; journals starting "Nature" count as Nature family; your name and the
# names of group members (from data/team.yaml) are bolded, and each paper appears
# on the Group page card of every member who co-authored it.
# =============================================================================

