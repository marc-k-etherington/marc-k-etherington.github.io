name: GitHub Pages

on:
  push:
    branches:
      - main            # publish when you commit to main
  pull_request:          # test-build (no publish) when you open a pull request
  schedule:
    - cron: "0 5 * * *"  # rebuild every morning so closed job adverts disappear
  workflow_dispatch:     # adds a "Run workflow" button on the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Hugo
        env:
          HUGO_VERSION: 0.145.0
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
            && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # Keeps the optimised images between builds: first build ~2 min, then seconds
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-images-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'content/**/*.JPG', 'static/**/*.jpg', 'static/**/*.jpeg', 'static/**/*.png', 'static/**/*.JPG') }}
          restore-keys: hugo-images-

      - name: Build
        run: hugo --minify --cleanDestinationDir

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
